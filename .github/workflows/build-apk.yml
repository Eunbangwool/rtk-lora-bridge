# ===================================================================
# RtkLoRaBridge - 자동 APK 빌드
# ===================================================================
# 단일 앱 repo (코드가 root 에 있음).
#  - 모든 push 에서 RtkLoRaBridge.apk 빌드 → 'latest' tag release 에 첨부
# 사용자는 폰에서 아래 URL 로 직접 설치:
#   https://github.com/<owner>/<repo>/releases/download/latest/RtkLoRaBridge.apk
#
# 빌드 매트릭스: AGP 8.2.2 / Kotlin 1.9.22 / Gradle 8.7 /
#               Compose Compiler 1.5.8 / JDK 17 /
#               minSdk 26 / targetSdk 34 / compileSdk 34

name: Build RtkLoRaBridge APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RtkLoRaBridge APK
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정 (8.7 직접 설치, wrapper 없이)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          validate-wrappers: false
          gradle-version: '8.7'

      - name: APK 빌드 (debug)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --parallel -x lint 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk RtkLoRaBridge.apk

      - name: 빌드 로그 (tail 200) GITHUB_STEP_SUMMARY 에 출력
        if: always()
        run: |
          echo '## Build log tail' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 빌드 로그를 artifact 로 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 14

      - name: 빌드 실패 시 release 본문 작성
        if: steps.build.outcome != 'success'
        run: |
          {
            echo '**❌ RtkLoRaBridge 빌드 실패 — 컴파일 로그 (tail 200)**'
            echo
            echo '## 빌드 정보'
            echo "- 커밋: \`${GITHUB_SHA::7}\`"
            echo "- 브랜치: \`${GITHUB_REF#refs/heads/}\`"
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo "- 일시: \`$(date '+%Y-%m-%d %H:%M') UTC\`"
            echo
            echo '## 로그'
            echo '```'
            tail -200 build.log
            echo '```'
          } > release_body.md

      - name: 빌드 성공 시 release body 작성
        if: steps.build.outcome == 'success'
        run: |
          REPO="${{ github.repository }}"
          {
            echo '**📡 자동 빌드된 RtkLoRaBridge APK**'
            echo
            echo '## 📲 폰에서 직접 설치'
            echo "[RtkLoRaBridge.apk](https://github.com/$REPO/releases/download/latest/RtkLoRaBridge.apk) 탭하여 다운로드."
            echo
            echo '## 🔖 빌드 정보'
            echo "- 일시: \`$(date '+%Y-%m-%d %H:%M') UTC\`"
            echo "- 커밋: \`${GITHUB_SHA::7}\`"
            echo "- 브랜치: \`${GITHUB_REF#refs/heads/}\`"
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo
            echo '## 🔗 폰 북마크용 직접 설치 URL'
            echo "https://github.com/$REPO/releases/download/latest/RtkLoRaBridge.apk"
          } > release_body.md

      - name: 최신 빌드 Release 업데이트
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "📡 RtkLoRaBridge 최신 빌드"
          body_path: release_body.md
          files: |
            RtkLoRaBridge.apk
            build.log
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: false

      - name: 빌드 실패면 워크플로우도 실패로 마감
        if: steps.build.outcome != 'success'
        run: |
          echo "Build failed — see release_body.md or build-log artifact."
          exit 1
