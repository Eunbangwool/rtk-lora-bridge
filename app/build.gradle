plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rtklorabridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.rtklorabridge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 고정 서명 키 — 모든 빌드를 같은 키로 서명해야 기존 설치본 위에 덮어쓰기(업데이트)가 된다.
    // 키가 매 빌드마다 달라지면 "기존 패키지와 충돌" 로 설치가 막힌다.
    signingConfigs {
        common {
            storeFile file('rtklora.jks')
            storePassword 'rtklora'
            keyAlias 'rtklora'
            keyPassword 'rtklora'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.common
        }
        release {
            signingConfig signingConfigs.common
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // USB Serial - CH340 지원
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.6'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Notification
    implementation 'androidx.core:core-ktx:1.12.0'

    // Manifest 테마(@style/Theme.AppCompat.DayNight) 사용을 위해
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
